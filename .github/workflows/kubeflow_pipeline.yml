name: Kubeflow Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install kfp

    - name: Compile Kubeflow Pipeline
      run: |
        python kubeflow_pipeline/mlops_pipeline.py
        echo "Pipeline compiled successfully."

