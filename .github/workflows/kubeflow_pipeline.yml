name: Kubeflow Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-compile:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements-mlops.txt

    - name: Compile Kubeflow Pipeline
      run: |
        python kubeflow_pipeline/mlops_pipeline.py
        echo "Pipeline compiled successfully."

